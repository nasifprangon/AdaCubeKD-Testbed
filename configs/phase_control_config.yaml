# configs/phase_control_config.yaml
#
# Stage 7 (phase-aware control) parameters.
#
# IMPORTANT: all plateau values below are DESIGN-CHOICE PLACEHOLDERS, not
# values derived from the paper's math. Section IV-C describes the phase
# behavior qualitatively only; this file is one concrete instantiation of
# that qualitative spec (see "Concrete instantiation used in our testbed",
# Section IV-C). Do not treat these numbers as tuned or final -- they have
# not yet been validated against real disagreement (D_t) convergence
# behavior on this testbed.

# Total training rounds for the schedule to span. NOTE: this is a
# provisional default for getting Stage 7 testable, not yet validated by
# an actual multi-round run. Revisit once D_t is observed to plateau (or
# not) within this budget.
T: 30

# Phase boundaries, as fractions of T. Equal thirds: Early = [0, 1/3),
# Middle = [1/3, 2/3), Late = [2/3, 1].
boundary1_frac: 0.3333
boundary2_frac: 0.6667

# Width (as a fraction of T) of the smoothstep transition zone centered on
# each boundary. E.g. 0.15 means parameters blend smoothly over roughly
# +/-7.5% of T around each boundary, rather than jumping discontinuously.
transition_width_frac: 0.15

# --- Critical Disagreement Band [d_min, d_max] ---
# Early: narrow, low-to-moderate. Middle: widest. Late: narrow again.
d_min_early: 0.30
d_max_early: 0.45

d_min_mid: 0.25
d_max_mid: 0.60

d_min_late: 0.35
d_max_late: 0.50

# --- Distillation strength lambda_t ---
# Early high (forgiving, stable) -> Middle moderate -> Late low (own fine-tuning)
lambda_t_early: 0.8
lambda_t_mid: 0.5
lambda_t_late: 0.2

# --- Softmax / distillation temperature tau_t ---
# Early high (soft targets) -> Middle annealing -> Late low (sharp targets)
tau_t_early: 4.0
tau_t_mid: 2.0
tau_t_late: 1.0

# --- Cost weight w_cost^t in U_i(j), Eq. (3) ---
# Early/Middle low (cost is secondary) -> Late high (cost penalized more)
w_cost_early: 0.05
w_cost_mid: 0.10
w_cost_late: 0.30
