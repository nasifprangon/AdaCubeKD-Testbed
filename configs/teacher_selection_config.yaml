# configs/teacher_selection_config.yaml
#
# Stage 5 (teacher selection) parameters.
#
# NOTE: d_min, d_max, and w_cost^t are now owned by Stage 7
# (node/phase_control.py / configs/phase_control_config.yaml) and are no
# longer read from this file -- select_teacher() fetches them internally
# via phase_control.get_phase_params(round_num, T, phase_cfg). Only w_u,
# w_c, w_r remain here, since the paper keeps those three fixed constants
# (only w_cost^t is phase-adaptive).

reference_batch_size: 100
data_root: datasets/cifar10_raw
weights_dir: logs/weights
model_name: simple_cnn
num_classes: 10
seed: 42

# U_i(j) = w_u*util + w_c*conf + w_cost^t*cost_score + w_r*rel  (Eq. 3)
# w_u, w_c, w_r are fixed non-negative constants per the paper.
w_u: 1.0
w_c: 1.0
w_r: 1.0

hop_distance_default: 1
hypercube_max_hops: 3   # d = log2(8), used to normalize raw cost -> cost_score
